name: 하네스

# 점수 규칙처럼 **두 리포에 걸친 규범**은 사람이 지킬 수 없다.
# 크롤러가 DB 에 넣는 점수와 웹이 화면에서 계산하는 점수가 갈려도
# 어느 쪽 PR 에서도 안 보인다 — 그래서 기계가 본다.
#
# 2026-09-25: 관측 단계를 끝냈다. baseline 3건(점수식 diversity·상한·독스트링)이
# 모두 해소돼 지금 위반이 0 건이다. 이제부터 새 위반은 CI 를 빨갛게 만든다.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  harness:
    runs-on: ubuntu-latest
    steps:
      # 로컬과 같은 배치로 둔다 — minnat 옆에 minnat-crawler.
      # 하네스는 형제 리포를 ROOT/../<이름> 으로 찾으므로(harness.config.mjs),
      # 워크스페이스 안에 나란히 놓으면 CI 전용 분기가 필요 없다.
      # (`path: ../` 는 actions/checkout 이 거부한다 — 워크스페이스 밖이다)
      - name: Checkout minnat
        uses: actions/checkout@v4
        with:
          path: minnat

      - name: Checkout minnat-crawler
        uses: actions/checkout@v4
        with:
          repository: ijbmsm/minnat-crawler
          path: minnat-crawler

      # score-parity 는 형제가 없으면 조용히 건너뛴다. 그러면 아무것도 안 막는데
      # CI 는 초록으로 뜬다 — 보호가 멈춘 걸 모르는 게 빨간불보다 나쁘다. 먼저 못 박는다.
      - name: 형제 리포 확인
        run: test -f minnat-crawler/config.py && test -f minnat-crawler/scorer.py

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # 자기검사를 먼저 돌린다. **하드 게이트다.**
      # 검사가 망가져도 위반 0 건은 그대로라, 이게 빨간불이면 아래 초록은 의미가 없다.
      # 레거시 부채가 0 이고 결정적이라 관측 기간을 둘 이유도 없다.
      - name: 하네스 자기검사
        working-directory: minnat
        run: node scripts/harness/selftest.mjs

      - name: 하네스
        working-directory: minnat
        run: node scripts/harness/run.mjs
